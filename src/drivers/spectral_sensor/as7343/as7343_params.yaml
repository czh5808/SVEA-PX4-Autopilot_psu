module_name: as7343
parameters:
- group: Sensors
  definitions:
    SENS_EN_AS7343:
      description:
        short: Enable AS7343 spectral sensor (external I2C)
      type: boolean
      default: 0
      reboot_required: true
    SENS_AS7343_GAIN:
      description:
        short: AS7343 spectral sensor analog gain
        long: |
          Analog gain applied to all spectral channels. Lower the gain if the
          sensor reports saturation, e.g. in direct sunlight.
      type: enum
      values:
        0: 0.5x
        1: 1x
        2: 2x
        3: 4x
        4: 8x
        5: 16x
        6: 32x
        7: 64x
        8: 128x
        9: 256x
        10: 512x
        11: 1024x
        12: 2048x
      default: 9
      reboot_required: true
